# =============================================================================
#  SIEM Support — sources.ini
#  Edit the paths below to match your environment.
#  See sources.ini.example for full option documentation.
# =============================================================================

[ml]
# Path to SIEM_ML-main — relative to this support project or absolute.
project_dir     = ../SIEM_ML-main
logs_dir        = logs
reports_dir     = reports
checkpoint_file = memory/fetcher_checkpoints.json


# Scan sample_source_logs/ for *.log files (good for testing).
# Replace with your real log directories when deploying.
[source_dirs]
paths = ../siem_support_final/sample_source_logs

# Uncomment to list exact files instead of scanning a directory:
# [source_files]
# files = C:/path/to/syslog.log, C:/path/to/auth.log
